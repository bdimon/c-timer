<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Interval Timer C & Web Suite</title>

    <meta property="og:title" content="Interval Timer C & Web Suite" />

    <!-- PWA & Mobile Web App Meta -->

    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Safely handle Service Worker: in Cloud preview / development environments, unregister to avoid redirect conflicts
      if ('serviceWorker' in navigator) {
        const isCloudDev = window.location.hostname.includes('run.app') || 
                           window.location.hostname === 'localhost' || 
                           window.location.port === '3000';
        if (isCloudDev) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          }).catch(() => {});
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker
              .register('/sw.js')
              .then((registration) => {
                console.log('PWA ServiceWorker registered with scope:', registration.scope);
              })
              .catch((err) => {
                console.log('PWA ServiceWorker registration failed:', err);
              });
          });
        }
      }
    </script>
  </body>
</html>
